name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # state:check asserts recorded commits are ancestors of HEAD via
          # `git merge-base --is-ancestor`. The default depth-1 clone has no
          # history, so every ancestry assertion fails. Needs full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # MAR-692: the drift gate needs orchestratedash, and CI never had it — so
      # `pnpm dash:schema:check` printed SKIPPED and exited 0 on every push,
      # which is how the broker catalogue went 598 commits stale and the pinned
      # manifest schema went without `access: "spend"` for 323. This clones DASH
      # at the commit the mirrors pin, so the check finally runs where it counts.
      #
      # Public repo, so no token. `--filter=blob:none --no-checkout` fetches
      # metadata only and then materialises exactly the pinned tree, which keeps
      # it to a few seconds. Deliberately no `pnpm install` in the clone: the two
      # broker files, the AI profile list and the fingerprint module are a
      # dependency-free island the gate executes directly, and if that ever stops
      # being true the gate fails loudly rather than degrading (see
      # scripts/dash-vocabulary.ts).
      - name: Check out orchestratedash at the pinned commit (MAR-692)
        run: |
          set -euo pipefail
          PIN=$(node -p "require('./tests/fixtures/dash/broker-profiles.json').source_commit")
          echo "pinned orchestratedash commit: $PIN"
          git clone --filter=blob:none --no-checkout \
            https://github.com/orchestratemcp/orchestratedash.git ../orchestratedash
          git -C ../orchestratedash checkout --detach "$PIN"

      # Named so it reports under its own heading rather than inside verify's
      # output — this is the check the whole of MAR-692 exists to add, and a
      # reviewer should be able to see it pass or fail without reading a log.
      # No --allow-missing here, unlike `pnpm verify`: the clone above means a
      # missing sibling is a broken workflow, and it must fail as one.
      - name: DASH vocabulary drift gate (MAR-692)
        run: pnpm dash:vocab:check

      # The conformance fixtures reach the registry through the generated
      # bundle, so it has to exist before the gate runs. `pnpm verify`
      # regenerates it anyway; doing it here lets the conformance gate report
      # first, under its own name, instead of hiding inside verify's output.
      - run: pnpm gen:registry

      # MAR-459: the named protocol conformance gate. Runs one fixture per
      # (revision × behavior) cell against the real MCP handler, binds each
      # result back to its cell, and fails when a supported revision drifts,
      # when a pinned cell has no executing fixture, when a pinned fixture
      # fails, or when docs/PROTOCOL_CONFORMANCE.md no longer matches its
      # source. A cell with no fixture publishes as "not pinned" — never as
      # conformant and never as failing.
      - name: Protocol conformance matrix (MAR-459)
        run: pnpm exec tsx scripts/conformance-matrix.ts --check

      - run: pnpm verify
