id: chat_triggered_assistant_route_v1
name: Chat-Triggered Assistant — Authorized Command, Gated Reply
status: candidate
summary: >
  Golden-path route for a chat-platform bot that runs a bounded task on an
  inbound slash command from an allowed sender and posts the reply back into
  the same channel only after human approval. Exactly the shape
  compose_workflow_route produces for a natural "Discord/Slack bot … slash
  command … only after I approve it" goal (live-probed 2026-08-07) — a
  leaner subset of the chat_triggered_assistant playbook's own broader
  component set (see notes).
goal_patterns:
  - (discord|slack|teams|telegram) bot .* slash command .* (approve|approval)
  - responds? to .* slash command .* only after .* approve
components:
  - chat_trigger
  - schema_validation
  - human_approval_gate
  - auth_failure_handler
  - discord_notification
  - audit_log
edges:
  - audit_log__recommended__chat_trigger
  - audit_log__recommended__discord_notification
known_playbooks_reused: []
untested_edges: []
risk_level: low
confidence: 0.7
required_evals:
  - authorized sender accepted, unauthorized sender rejected (unit)
  - approval enforcement — no reply is posted when approval is absent
failure_modes:
  - unauthorized sender triggers a privileged action because the authorization check was skipped or misconfigured
  - prompt-injection in the message body steers the agent into an unintended action
  - duplicate delivery without an idempotency key causes a double reply
  - bot token expiry silently stops inbound events — the bot goes deaf with no error surfaced
evals:
  - injection resistance — an instruction embedded in the message body does not expand the agent's allowed actions
  - idempotency — a duplicated inbound event produces exactly one reply
notes: >
  MAR-513 gap-list item 2a: chat_triggered_assistant's own playbook YAML has
  carried golden_path_route_id: '' (an explicit empty string, no route file
  at all) since it was drafted. This route closes that gap with the route
  the live matcher actually produces for the playbook's own goal shape,
  rather than a route hand-copied from the playbook's aspirational
  component list. Two components on the playbook's own list — intent_classifier
  and state_store — do not fire from natural phrasing of this goal without
  either introducing compose noise (a duplicate reviewer_notification match on
  generic "approval"/"request" tokens) or pulling in an unrelated loop_controller
  (a "keeps state" phrasing collides with the state_store/loop_controller
  token overlap). This route documents the clean, noise-free shape instead;
  a conversation-continuity variant that genuinely needs state_store is
  follow-up scope, same precedent as second_brain_route_v1 documenting only
  the QUERY-path subset of its own playbook. Status stays candidate — see
  the paired playbook's status note for why (validate_playbook_candidate
  bar, not yet Lab-evidenced). Candidate status keeps this route out of the
  default-loaded registry, so plan_source stays composed for this goal; the
  paired golden-journey fixture is this pattern's durable regression gate.
sources: []
