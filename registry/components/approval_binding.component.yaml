id: approval_binding
name: Approval Binding
status: published
category: safety
summary: Binds a human approval to the exact payload that was approved — a digest over the canonicalised payload plus a single-use token issued at gate time — and refuses execution when the payload presented later does not match.
capabilities:
  - bind_approval_to_executed_payload
  - issue_single_use_approval_receipt
  - refuse_execution_on_payload_drift
inputs:
  - the canonicalised payload exactly as it was shown to the approver
  - the gate's approved | rejected | timeout decision
outputs:
  - approval receipt — a digest over the approved payload plus a single-use token scoped to one execution
  - a refusal when the payload presented at execution time does not match the approved digest
risk_level: low
side_effects: []
permissions:
  read:
    - proposed payload as shown to the approver
    - approval decision
  write: []
  approval_required_for: []
requires:
  - human_approval_gate
recommended_with:
  - audit_log
avoid_with: []
failure_modes:
  - the payload is re-read or re-rendered between approval and execution, so the digest covers a payload that is no longer the one being sent (the TOCTOU window)
  - a replayed or reused approval token authorises a second execution the human approved only once
  - an LLM step re-runs after approval and regenerates different text — the commonest real case, and indistinguishable from tampering when only the executed payload is recorded
  - the binding check is disabled in test mode and the build ships with it off, so every execution passes unverified
  - the digest is taken over a rendered summary rather than the payload actually sent, so a field the approver never saw can still change freely
evals:
  - mutated-payload fixture — alter one field after approval and assert the execution is REFUSED, not merely logged
  - replay fixture — present the same approval token twice and assert the second execution is refused
  - canonicalisation fixture — reorder keys and re-encode whitespace and assert the digest is unchanged
  - bypass regression test — assert the binding check cannot be disabled by configuration in a production build
tested_in_playbooks:
  - content_approval_pipeline
  - email_calendar_assistant
  - email_lead_to_crm
tested_in_routes:
  - content_approval_route_v1
  - email_calendar_route_v1
  - email_lead_crm_route_v1
sources:
  - title: "OpenClaw — exec approvals: canonical execution context and deny-on-drift"
    url: https://github.com/openclaw/openclaw/blob/main/docs/tools/exec-approvals.md
    source_type: official_docs
    last_checked: "2026-08-23"
  - title: Temporal — human-in-the-loop, request_id continuity between approval and execution
    url: https://docs.temporal.io/ai-cookbook/human-in-the-loop-python
    source_type: official_docs
    last_checked: "2026-08-23"
  - title: MCP 2026-07-28 approver continuity — the server must verify the person who started an approval finished it
    url: https://www.cakewalk.security/blog/mcp-spec-agent-access-control-accountability
    source_type: blog
    last_checked: "2026-08-23"
  - title: "OpenClaw issue #65486 — pending approvals held in an in-memory Map, lost on restart"
    url: https://github.com/openclaw/openclaw/issues/65486
    source_type: example_repo
    last_checked: "2026-08-23"

model_tier: none
fallback_tier: none
context_need: minimal
compression_strategy: none
