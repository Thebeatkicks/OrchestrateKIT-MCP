id: approval_binding__produces__calendar_write
from: approval_binding
to: calendar_write
relation: produces_input_for
status: published
reason: The write takes the approval receipt as an input and refuses to run when the approved digest does not cover the event it is about to create. That is what this edge states and sequencing does not — the write CONSUMES the approval rather than merely running after it. A route can order gate, write and log correctly and still bind nothing — sequence is not provenance.
severity: high
notes: >
  MAR-749 (MAR-540 bar #3). An invite fires notifications to every attendee the instant it is created, so a changed attendee list or time is visible to other people before anyone can compare it against what was approved.

  Refusal, not logging. A payload that fails the check must not execute;
  recording a mutated payload after the fact is the failure, not the
  detection of it. See docs/ADR-MAR-540-approval-provenance.md.
conditions: []
tested: true
test_refs:
  - "tests/graph/approvalProvenance.test.ts > every gated write consumes the binding"
