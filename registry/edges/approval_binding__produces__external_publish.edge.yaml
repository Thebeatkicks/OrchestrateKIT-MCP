id: approval_binding__produces__external_publish
from: approval_binding
to: external_publish
relation: produces_input_for
status: published
reason: The write takes the approval receipt as an input and refuses to run when the approved digest does not cover the post it is about to publish. That is what this edge states and sequencing does not — the write CONSUMES the approval rather than merely running after it. A route can order gate, write and log correctly and still bind nothing — sequence is not provenance.
severity: high
notes: >
  MAR-749 (MAR-540 bar #3). A published post is the canonical irreversible write in this registry — content_approval_route_v1 is built around it. Between approval and publish a copy_generation step can be re-run, and the platform payload can be re-rendered from a template; either produces bytes the approver never saw.

  Refusal, not logging. A payload that fails the check must not execute;
  recording a mutated payload after the fact is the failure, not the
  detection of it. See docs/ADR-MAR-540-approval-provenance.md.
conditions: []
tested: true
test_refs:
  - "tests/graph/approvalProvenance.test.ts > every gated write consumes the binding"
