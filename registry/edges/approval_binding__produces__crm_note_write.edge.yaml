id: approval_binding__produces__crm_note_write
from: approval_binding
to: crm_note_write
relation: produces_input_for
status: published
reason: The write takes the approval receipt as an input and refuses to run when the approved digest does not cover the note and the record id it is about to write to. That is what this edge states and sequencing does not — the write CONSUMES the approval rather than merely running after it. A route can order gate, write and log correctly and still bind nothing — sequence is not provenance.
severity: high
notes: >
  MAR-749 (MAR-540 bar #3). The note is written against a record id resolved upstream. Binding covers the resolved id as well as the text — a note whose body was approved and whose target record changed is drift, and the log alone cannot show it.

  Refusal, not logging. A payload that fails the check must not execute;
  recording a mutated payload after the fact is the failure, not the
  detection of it. See docs/ADR-MAR-540-approval-provenance.md.
conditions: []
tested: true
test_refs:
  - "tests/graph/approvalProvenance.test.ts > every gated write consumes the binding"
